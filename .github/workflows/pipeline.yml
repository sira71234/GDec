name: Pipeline GDec

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test
      - run: composer audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          VITE_API_URL: /api
          VITE_STORAGE_URL: /storage

  deploy:
    name: Déploiement sur gdec.page.gd
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-infinityfree
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Construire le front
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: /api
          VITE_STORAGE_URL: /storage

      - name: Envoyer le front dans public/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: htdocs/public/
          state-name: .ftp-state-front.json
          dry-run: true

      - name: Envoyer le code du back (sans vendor, .env ni storage)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: htdocs/
          state-name: .ftp-state-back.json
          dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            vendor/**
            storage/**
            tests/**
            database/**
            public/storage/**
            .env
            .env.*
            .htaccess
            .agents/**
            AGENTS.md
            README.md
            boost.json
